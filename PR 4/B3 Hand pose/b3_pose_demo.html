
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>B3 Hand Pose Classifier</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<style>
body { font-family: Arial; text-align: center; background: #f5f5f5; }
button { padding: 12px 20px; font-size: 16px; cursor: pointer; }
#result { font-size: 24px; font-weight: bold; margin: 16px; }
</style>
</head>
<body>
<h2>B3 — Stone, Paper, Scissor ✊✋✌️</h2>
<button id="start">Start Webcam & Prediction</button>
<div id="result">Click Start to begin</div>
<div id="camera"></div>
<div id="predictions"></div>

<script>
const base = "/models/pose/";
let model, webcam, running = false;

document.getElementById("start").onclick = async () => {
  const button = document.getElementById("start");
  button.disabled = true;

  try {
    model = await tmPose.load(base + "model.json", base + "metadata.json");
    webcam = new tmPose.Webcam(400, 400, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("camera").appendChild(webcam.canvas);
    running = true;
    button.textContent = "Webcam Running";
    predictLoop();
  } catch (err) {
    document.getElementById("result").textContent =
      "Error: " + err.message + ". Check camera permission and internet.";
    button.disabled = false;
  }
};

async function predictLoop() {
  if (!running) return;
  webcam.update();

  const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
  const predictions = await model.predict(posenetOutput);

  predictions.sort((a, b) => b.probability - a.probability);
  const best = predictions[0];

  document.getElementById("result").textContent =
    best.className.trim() + " — " + (best.probability * 100).toFixed(1) + "%";

  document.getElementById("predictions").innerHTML = predictions.map(p =>
    `<p>${p.className.trim()}: ${(p.probability * 100).toFixed(1)}%</p>`
  ).join("");

  requestAnimationFrame(predictLoop);
}
</script>
</body>
</html>
